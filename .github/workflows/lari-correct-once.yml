name: Apply precise runner cadence correction

on:
  push:
    branches:
      - "feat/fishing-gameplay-v2"
    paths:
      - ".github/workflows/lari-correct-once.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fishing-gameplay-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Correct fight cadence
        run: node tools/correct-runner-cadence.mjs

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/game/fight.ts
          git commit -m "fix: scope recovery cadence to runner fish"
          git push origin HEAD:feat/fishing-gameplay-v2
