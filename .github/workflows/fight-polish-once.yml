name: Apply fight cadence polish once

on:
  push:
    branches:
      - "feat/fishing-gameplay-v2"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fishing-gameplay-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply fight cadence patch
        run: node tools/apply-fight-polish.mjs

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/game/fight.ts
          git commit -m "feat: add readable surge and recovery fight cadence"
          git push origin HEAD:feat/fishing-gameplay-v2
