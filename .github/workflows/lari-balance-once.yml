name: Correct runner fight balance once

on:
  push:
    branches:
      - "feat/fishing-gameplay-v2"
    paths:
      - ".github/workflows/lari-balance-once.yml"

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fishing-gameplay-v2
          fetch-depth: 0

      - name: Correct runner cadence scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/client/game/fight.ts')
          s = p.read_text()

          wrong = """        } else {
          s.phase = 1.9 + Math.random() * 1.4;        // playing dead
          s.vel = 0;
"""
          fixed = """        } else {
          s.phase = 1.6 + Math.random() * 1.4;        // playing dead
          s.vel = 0;
"""
          if wrong not in s:
              raise SystemExit('mengendap correction anchor missing')
          s = s.replace(wrong, fixed, 1)

          old_runner = """      if (s.phase <= 0) {
        // Alternate ends so an open-water run can never choose its current
        // side twice and pretend to be a meaningful burst.
        s.beat = s.beat === 0 ? 1 : 0;
        s.phase = 1.6 + Math.random() * 1.4;
      }
"""
          new_runner = """      if (s.phase <= 0) {
        // Alternate ends so an open-water run can never choose its current
        // side twice and pretend to be a meaningful burst.
        s.beat = s.beat === 0 ? 1 : 0;
        s.phase = 1.9 + Math.random() * 1.4;
      }
"""
          if old_runner not in s:
              raise SystemExit('runner recovery anchor missing')
          s = s.replace(old_runner, new_runner, 1)
          p.write_text(s)
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/game/fight.ts
          git commit -m "fix: scope recovery cadence to runner fish"
          git push origin HEAD:feat/fishing-gameplay-v2
